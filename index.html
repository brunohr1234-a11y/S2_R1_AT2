<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🤪​ Cadastro - Consultório Dus Bom 🤪​</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Painel Esquerdo -->
    <div class="left-panel">
      <div class="logo">
        <div class="logo-icon">+</div>
        <span>🤪​ Consultório Dus Bom 🤪​</span>
      </div>

      <div class="welcome-text">
        <h1>Bem-vindo,</h1>
        <p> Sua consulta está a apenas um clique!</p>
      </div>

      <div class="footer-text">
        Informe seus dados ao lado e desfrute da melhor ferramenta de gerenciamento de consultórios.
      </div>

      <div class="divider-arrow">&#10095;</div>
    </div>

    <!-- Painel Direito (Cadastro) -->
    <div class="right-panel">
      <div class="header-form">
        <h2>Cadastro</h2>
        <p>Já tem uma conta? <a href="#">Entre aqui!</a></p>
      </div>

      <form>
        <div class="section-title">Dados Pessoais</div>
        
        <div class="form-grid">
          <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Informe seu nome completo">
          </div>

          <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="Informe os números do seu CPF">
          </div>

          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Informe o seu e-mail">
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="••••••••">
          </div>
        </div>

        <div class="section-title">Dados Profissionais</div>

        <div class="form-grid">
          <div class="form-group">
            <label for="conselho">Sigla do Conselho</label>
            <select id="conselho">
              <option value="" disabled selected>Selecione ou digite a sigla</option>
              <option value="crm">CRM</option>
              <option value="cro">CRO</option>
              <option value="crefito">CREFITO</option>
            </select>
          </div>

          <div class="form-group">
            <label for="uf">UF</label>
            <select id="uf">
              <option value="" disabled selected>Selecione ou digite o estado</option>
<option value="AC">AC</option>
<option value="AL">AL</option>
<option value="AP">AP</option>
<option value="AM">AM</option>
<option value="BA">BA</option>
<option value="CE">CE</option>
<option value="DF">DF</option>
<option value="ES">ES</option>
<option value="GO">GO</option>
<option value="MA">MA</option>
<option value="MT">MT</option>
<option value="MS">MS</option>
<option value="MG">MG</option>
<option value="PA">PA</option>
<option value="PB">PB</option>
<option value="PR">PR</option>
<option value="PE">PE</option>
<option value="PI">PI</option>
<option value="RJ">RJ</option>
<option value="RN">RN</option>
<option value="RS">RS</option>
<option value="RO">RO</option>
<option value="RR">RR</option>
<option value="SC">SC</option>
<option value="SP">SP</option>
<option value="SE">SE</option>
<option value="TO">TO</option>            </select>
          </div>

          <div class="form-group">
            <label for="num-conselho">Número do Conselho</label>
            <input type="text" id="num-conselho" placeholder="Informe o seu número do Conselho">
          </div>

          <div class="form-group">
            <label for="especialidade">Especialidade</label>
            <input type="text" id="especialidade" placeholder="Informe a sua especialidade">
          </div>
        </div>

        <div class="btn-submit-container">
          <button type="submit" class="btn-submit">Cadastrar</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
